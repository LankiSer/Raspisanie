services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: vksit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-schedule_saas}
      POSTGRES_USER:     ${POSTGRES_USER:-schedule_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schedule_user} -d ${POSTGRES_DB:-schedule_saas}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: '2', memory: 1G }
        reservations: { cpus: '0.5', memory: 256M }

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vksit_backend:latest
    container_name: vksit_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:  "postgresql+asyncpg://${POSTGRES_USER:-schedule_user}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-schedule_saas}"
      JWT_SECRET:    ${JWT_SECRET}
      JWT_EXPIRES:   ${JWT_EXPIRES:-3600}
      TZ:            ${TZ:-Europe/Moscow}
      DEBUG:         "false"
      LOG_LEVEL:     "WARNING"
      CORS_ORIGINS:  ${CORS_ORIGINS:-https://raspisanie.vksit.ru}
      API_V1_PREFIX: /api/v1
    networks:
      - backend_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:   { cpus: '2', memory: 1G }
        reservations: { cpus: '0.5', memory: 256M }

  # ── Vue 3 Frontend (served by nginx inside container) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: vksit_frontend:latest
    container_name: vksit_frontend
    restart: unless-stopped
    networks:
      - backend_net
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:   { cpus: '1', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }

  # ── Nginx reverse-proxy + TLS ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: vksit_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend_net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:   { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.1', memory: 32M }

  # ── Certbot (runs once, then renews) ────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: vksit_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "

volumes:
  postgres_data:
  nginx_logs:
  certbot_www:
  certbot_certs:

networks:
  backend_net:
    driver: bridge
