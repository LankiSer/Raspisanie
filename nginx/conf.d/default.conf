# ── HTTP: redirect to HTTPS + Certbot ACME challenge ──────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name raspisanie.vksit.ru www.raspisanie.vksit.ru;

    # Certbot ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raspisanie.vksit.ru www.raspisanie.vksit.ru;

    # ── TLS (managed by Certbot) ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/raspisanie.vksit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raspisanie.vksit.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Auth endpoints (strict rate limit) ─────────────────────────────────
    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ── Generation endpoints (long-running OR-Tools) ───────────────────────
    location /api/v1/generation/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass            http://backend:8000;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto  $scheme;
        proxy_http_version    1.1;
        proxy_buffering       off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── API proxy ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # ── Health (skip rate limit) ────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # ── Static assets (long cache) ──────────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|ico|gif|webp)$ {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # ── Vue SPA (client-side routing) ──────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ── Block dotfiles ──────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
